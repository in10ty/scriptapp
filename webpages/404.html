/*

Disclaimer:

For anyone inspecting this code, I'm aware that there's a fair amount of bloat and technical debt 
for something that's meant to be an example of How Things Should Be Done. While I'm not sending 
2MB of compressed JavaScript to users like some websites do, these pages are probably twice as big 
as they could be without minifying the source code. I've picked all of the low hanging fruit I 
could, so whatever bloat remains is stuff I lacked either the time or the skill to fix.

In the event that the Intentionality ecosystem takes off, we can revisit this. If it turns out 
that refactoring this code to be smaller and simpler is a worthwhile use of our engineering time 
[1], we can do that. But right now, I don't think it's worth spending 2 weeks shaving off 100KB of 
bloat when some pages are e.g. 1.2MB uncompressed HTML because 700KB of that is an inline SVG 
world map that prevents the need to cache 50MB of OpenStreetMap tiles so it can be used offline, 
which itself has already been shaved down from a 2MB starting size. 

[1] The basis for doing this is less about raw size and more about making it easy for amateur 
third parties to audit the code themselves.

*/

/* style.css --- Inline css template for all ScriptApp pages */

/* #region Root variables */
:root {
  font-size: 16px; /* Lock rem scaling so pixel values can be relied on */

  /* Desired real screen pixel values */
  --real-border-px: 1px; /* Default number of real pixels thick to make box borders */
  --real-radius-px: 4px; /* Default number of real pixels to round corners by */

  /* Pixel scaling ratios (used for better display of borders and media) */
  --dpr-js: 1; /* Javascript variable to deal with irrational zoom levels gracefully */
  --ios-zoom-js: 1; /* Javascript variable to bypass Apple's fake zoomed DPR reporting */
  --dpr-ios: calc(var(--dpr-js) * var(--ios-zoom-js));
  --dpr: var(--dpr-js); /* Variable for all calculations, can be changed to static */

  --css-border-px: calc(var(--real-border-px) / var(--dpr));
  --css-radius-px: calc(var(--real-radius-px) / var(--dpr));
  --line-width: var(--css-border-px);
  --radius: var(--css-radius-px);

  /* Colors in rgb(values) */
  --color-bg:       250, 250, 250; /* Default background */
  --color-bg-code:  240, 240, 240; /* Codeblock background */
  --color-hr-light: 200, 200, 200; /* For faint hr lines */
  --color-fade:     180, 180, 180; /* For left outline */
  --color-hover:    120, 120, 120; /* Link hover (black and grey) */
  --color-text:      40,  40,  40; /* Default text */

  --color-in10ty:   210,  10,  10; /* Red for ecosystem links */
  --color-lw:        50, 126,   9; /* Match LW green for LW links */
  --color-wiki:      51, 102, 204; /* Match Wikipedia blue for wiki links */

  /* Opacity values */
  --op-hover-text:      0.7; /* Link hover opacity for colored text */
  --op-dark-underline:  0.4; /* Less faded option for black and grey underlines */
  --op-underline:       0.3; /* Colored link underlines */
  --op-hover-underline: 0.2; /* Colored hovered link underlines */

  /* Fonts */
  --font-title: 'Merriweather Latin Headings', Arial, serif; /* Headings */
  --font-body:  'Inter Subset', Arial, sans-serif; /* General text font */

  --font-serif: serif; /* Serif option */
  --font-code:  monospace; /* Font for code */

  /* Vertical sizes */
  --outer-v: 12px; /* Padding for external top and bottom */
  --v-space: 16px;    /* Top and bottom spacing for most elements */
  --indent: 16px;     /* Indent for quotes and mobile sidenotes */
}
/* #endregion
*/

/* #region Custom DPR scaling feature */
@supports (-webkit-touch-callout: none){ /* Targets Apple devices */
  :root {
    --ios: 1; /* Used for telling JS the device is iOS */
    --dpr: var(--dpr-ios); /* Calculate real DPR differently on iOS */
  }
}

/* Code for handling border widths and radiuses */
@media (min-resolution: 0.491dppx) and (max-resolution: 1.690dppx){
  :root {--real-border-px: 1px; --real-radius-px: 4px;}}
@media (min-resolution: 1.691dppx) and (max-resolution: 4.001dppx){
  /* 85% zoom on a 2 DPR display still gets 2px */
  :root {--real-border-px: 2px; --real-radius-px: 6px;}}
@media (min-resolution: 4.002dppx) and (max-resolution: 5.490dppx){
  :root {--real-border-px: 3px; --real-radius-px: 8px;}}

@media (min-resolution: 5.491dppx), (max-resolution: 0.490dppx){
  /* Revert back to using fake CSS pixels above 5.5x or below 0.5x DPR */
  :root {--css-border-px: 1px; --css-radius-px: 4px;}}

/* #endregion
*/

/* #region Base styling for all pages */
html {
  line-height: 150%;
  font-family: var(--font-body);
  font-weight: 425; /* Slightly more bold than standard */
  color: rgb(var(--color-text));
  background-color: rgb(var(--color-bg));
  margin: 0 auto;
}

body {
  margin: var(--outer-v) 0;
}

header {
  width: 100%;
  position: relative;
  margin: var(--outer-v) auto;
}

.topbar {
  text-align: center; /* Center links over main article text */
  line-height: 125%; /* Approximates actual text without implicit margin */
}

span.dash, span.pipe { /* For subtle link seperation */
  color: rgb(var(--color-hover));
  font-weight: 200;
}

/* Headers */
h1, h2, h3, h4, h5, h6 {
  line-height: calc(4/3); /* 133% */
  position: relative; /* Useful for index spans */
  display: flex; /* Make a flex container */
  align-items: center; /* Vertically center items */
}

h1, h2, h3, h4 {
  margin: 24px 0 4px 0;
  font-family: var(--font-title);
  font-weight: 550;
  font-variation-settings: 'wdth' 105; /* Variable font is a bit slim at 100% */
}

h1 {
  font-size: 30px;
  margin: 0;
}
h2 {font-size: 27px; }
h3 {font-size: 24px; }
h4 {font-size: 21px; }
h5, h6 {
  margin: 0;
  margin-top: 16px;
  font-family: var(--font-body);
  font-weight: 650;
  font-size: 16px;
  line-height: 150%;
}

hr {
  height: var(--line-width);
  border: 0;
  background-color: rgb(var(--color-hr-light));
  margin: var(--v-space) 0;
}

/* General links */
a:link, a:visited {
  color: rgb(var(--color-text));
  text-decoration-color: rgba(var(--color-text), var(--op-dark-underline));
}
a:hover {
  color: rgb(var(--color-hover));
  text-decoration-color: rgba(var(--color-hover), var(--op-dark-underline));
}

/* List styling */
li {
  margin: 0.25em 0; /* Increase vertical spacing between list items */
}

ul, ol {
  list-style: none; /* Remove default markers */
  padding: 0; /* Remove indent */
}

ul ul li, ol ol li, ul ol li, ol ul li {
  padding-left: var(--indent); /* Indent only on nested lists */
}

ul li::before { /* Restyle the bullet point */
  display: inline-block;
  content: "•";
  text-align: center;
  width: 0.75em;
  margin-right: 0.25em;
}

ol li::before { /* Restyle numbered lists */
  display: inline-block;
  content: counter(list-item) ".";
  font-weight: 650; /* Make numbers bold */
  margin-right: 0.25em;
  font-feature-settings: "tnum"; /* Equally space numbers */
  font-variant-numeric: tabular-nums; /* Fallback */
}

/* #endregion */

  <script>
// Javascript base template originally from the in10ty.org theme

// 1. Log that JavaScript is enabled in a CSS variable
document.documentElement.style.setProperty('--js-enabled', 1);

// 2. Detect the real Device Pixel Ratio (DPR) for use in scaling calculations
// 2.1. Set the module state variables
let currentDpr = 1;
let currentIosZoom = 1;

// 2.2. Create an update function for the variables
const updateProps = () => {
  // 2.2.1. Check Device Pixel Ratio (DPR) of the screen
  currentDpr = window.devicePixelRatio;

  // 2.2.2. Check zoom level (hack to find the real DPR on iOS)
  const getZoomLevel = () => {
    if (window.visualViewport) {
      return window.visualViewport.scale;
    }
    return 1;
  };
  currentIosZoom = getZoomLevel().toFixed(4);

  // 2.2.3. Export the variables to CSS
  document.documentElement.style.setProperty('--dpr-js', currentDpr);
  document.documentElement.style.setProperty('--ios-zoom-js', currentIosZoom);
};

// 2.3. Refresh the values if they change
updateProps();
window.addEventListener('resize', updateProps);
  </script>
